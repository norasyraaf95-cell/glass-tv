name: Build Glass TV Parents APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build signed release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease

      - name: Verify APK and embedded preset
        run: |
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/Glass-TV-Parents.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/Glass-TV-Parents.apk
          python3 - <<'PY'
          import json, zipfile
          expected = [
              "org.smarttube.stable",
              "net.flystream.tv",
              "com.netflix.ninja",
              "studio.scillarium.ottnavigator",
              "com.google.android.youtube.tv",
          ]
          with zipfile.ZipFile("dist/Glass-TV-Parents.apk") as apk:
              config = json.loads(apk.read("assets/parents-config.json"))
          assert config["dock_apps"] == expected
          assert config["columns"] == 5 and config["rows_below_dock"] == 0
          assert config["places"] is False and config["wallpaper"] is False
          assert config["cache_clean_days"] == 7 and config["reduced_motion"] is True
          print("Five-app preset verified.")
          PY

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-TV-Parents
          path: dist/Glass-TV-Parents.apk
          if-no-files-found: error
          retention-days: 30
