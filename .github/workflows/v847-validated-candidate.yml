name: Glass TV V8.4.7 — validated isolated APK

on:
  push:
    branches:
      - glass-tv-v847-premium-launch-cue
    paths:
      - '.github/workflows/v847-validated-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Python source regression (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression suite
        run: python3 -m unittest discover -s tests -v

  android-tests:
    name: Android Gradle unit tests (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run release unit tests
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest

  isolated-candidate:
    name: Build isolated candidate (never installs)
    needs: [source-checks, android-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble experimental release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify identity, size, and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/v847-badging.txt
          grep -F "package: name='com.gathin.tvhome.referencev781v847' versionCode='31' versionName='2.9.8.4.7-premium-launch-cue-experimental'" /tmp/v847-badging.txt
          size=$(stat -c %s "$APK")
          echo "candidate APK bytes=$size"
          test "$size" -lt 409600
          cp "$APK" GlassTV_V8.4.7_premium_cue.apk
          sha256sum GlassTV_V8.4.7_premium_cue.apk | tee GlassTV_V8.4.7_sha256.txt
      - name: Publish downloadable candidate, not a TV install
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-V8.4.7-premium-cue-candidate
          path: |
            GlassTV_V8.4.7_premium_cue.apk
            GlassTV_V8.4.7_sha256.txt
          if-no-files-found: error
          retention-days: 30
