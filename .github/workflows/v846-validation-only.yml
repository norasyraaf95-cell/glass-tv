name: Glass TV V8.4.6 — source validation only

on:
  push:
    branches:
      - glass-tv-v846-motion-handoff-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    name: Python source regression (NO APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all source regression tests
        run: python3 -m unittest discover -s tests -v

  android-unit-test:
    name: Android Gradle unit tests (NO APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run release unit tests (no assembleRelease)
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest
