name: Glass TV V8.4.7 — source and Android validation

on:
  push:
    branches:
      - glass-tv-v847-visible-launch-cue-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    name: Source regression (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v

  android-unit-tests:
    name: Android compile + unit tests (no APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test — no assembleRelease
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest
