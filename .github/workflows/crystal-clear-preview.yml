name: Glass TV Crystal Control V2 Glass Ambient Preview

on:
  push:
    branches:
      - crystal-control-v2-glass-ambient-preview-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Compile & validate Crystal Control V2 isolated Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Crystal Control Center regression and safety contracts
        run: python3 -m unittest discover -s tests -p 'test_crystal_clear_v2_contract.py' -v
      - name: Compile and test Android
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Verify independent APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > /tmp/crystal-badging.txt
          grep -F "package: name='com.gathin.tvhome.crystalcontrolv2preview' versionCode='44' versionName='3.1.0-crystal-control-v2-preview'" /tmp/crystal-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/magnetic-b-home-manifest.txt
          if grep -F 'android.intent.category.HOME' /tmp/magnetic-b-home-manifest.txt; then
            echo 'Safety failure: V2 preview must not be HOME eligible'; exit 1
          fi
          cp "$apk" GlassTV_Crystal_Control_V2_Preview.apk
          sha256sum GlassTV_Crystal_Control_V2_Preview.apk > GlassTV_Crystal_Control_V2_sha256.txt
      - name: Upload separate APK for manual TV testing
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Crystal-Control-V2
          path: |
            GlassTV_Crystal_Control_V2_Preview.apk
            GlassTV_Crystal_Control_V2_sha256.txt
          retention-days: 30
          if-no-files-found: error
