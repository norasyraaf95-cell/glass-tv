name: Glass TV Magnetic Spotlight B HOME-ready

on:
  push:
    branches:
      - magnetic-spotlight-b-home-ready-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    name: Build separate HOME-ready Magnetic Spotlight B
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Crystal Clear V2 safety and interaction contracts
        run: python3 -m unittest discover -s tests -p 'test_crystal_clear_v2_contract.py' -v
      - name: Compile and test Android
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Verify independent APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" > /tmp/crystal-badging.txt
          grep -F "package: name='com.gathin.tvhome.crystalclearmagneticbhome' versionCode='40' versionName='2.9.8.5.5-magnetic-b-home'" /tmp/crystal-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/magnetic-b-home-manifest.txt
          grep -F 'android.intent.category.HOME' /tmp/magnetic-b-home-manifest.txt
          grep -F 'android.intent.category.DEFAULT' /tmp/magnetic-b-home-manifest.txt
          cp "$apk" GlassTV_Magnetic_B_Home.apk
          sha256sum GlassTV_Magnetic_B_Home.apk > GlassTV_Magnetic_B_Home_sha256.txt
      - name: Upload separate APK for manual TV testing
        uses: actions/upload-artifact@v4
        with:
          name: GlassTV-Magnetic-B-Home
          path: |
            GlassTV_Magnetic_B_Home.apk
            GlassTV_Magnetic_B_Home_sha256.txt
          retention-days: 30
          if-no-files-found: error
